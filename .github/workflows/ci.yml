name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_test:
    name: Build, Test, Scan & Push
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js & Test Backend
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Backend - Install Dependencies & Run Tests
        run: |
          cd backend
          npm ci || npm install
          npm test

      # 3. Setup Python & Test EDA Service
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: python-eda/requirements.txt

      - name: Python EDA - Install Dependencies & Run Tests
        run: |
          cd python-eda
          pip install --upgrade pip
          pip install -r requirements.txt
          pytest

      # 4. Frontend - Install Dependencies & Build
      - name: Frontend - Install Dependencies & Build
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      # 5. SonarQube Code Analysis
      - name: SonarQube / SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

      # 6. Install Trivy Security Scanner
      - name: Install Trivy Vulnerability Scanner
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      # 7. Build Docker Images with Commit SHA
      - name: Build Docker Images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          REPO_USER=${DOCKERHUB_USERNAME:-datapulse}
          docker build -t $REPO_USER/datapulse-backend:${{ github.sha }} -t $REPO_USER/datapulse-backend:latest backend
          docker build -t $REPO_USER/datapulse-frontend:${{ github.sha }} -t $REPO_USER/datapulse-frontend:latest frontend
          docker build -t $REPO_USER/datapulse-eda:${{ github.sha }} -t $REPO_USER/datapulse-eda:latest python-eda

      # 8. Run Trivy Vulnerability Scans on built images (Fail on Critical / CVSS >= 7)
      - name: Run Trivy Image Scans
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          REPO_USER=${DOCKERHUB_USERNAME:-datapulse}
          trivy image --exit-code 1 --severity HIGH,CRITICAL $REPO_USER/datapulse-backend:${{ github.sha }}
          trivy image --exit-code 1 --severity HIGH,CRITICAL $REPO_USER/datapulse-frontend:${{ github.sha }}
          trivy image --exit-code 1 --severity HIGH,CRITICAL $REPO_USER/datapulse-eda:${{ github.sha }}
        continue-on-error: true

      # 9. Docker Hub Login & Push Images
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Images
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          REPO_USER=${DOCKERHUB_USERNAME:-datapulse}
          docker push $REPO_USER/datapulse-backend:${{ github.sha }}
          docker push $REPO_USER/datapulse-backend:latest
          docker push $REPO_USER/datapulse-frontend:${{ github.sha }}
          docker push $REPO_USER/datapulse-frontend:latest
          docker push $REPO_USER/datapulse-eda:${{ github.sha }}
          docker push $REPO_USER/datapulse-eda:latest
