version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: dp-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-datapulse}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-datapulse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-eda:
    build:
      context: ./python-eda
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-datapulse}/datapulse-eda:${IMAGE_TAG:-latest}
    container_name: dp-eda
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-datapulse}/datapulse-backend:${IMAGE_TAG:-latest}
    container_name: dp-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${POSTGRES_DB:-datapulse}
      - JWT_SECRET=${JWT_SECRET:-datapulse_super_secret_jwt_key_2026}
      - PYTHON_EDA_URL=http://python-eda:5000
      - UPLOAD_DIR=/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      python-eda:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-datapulse}/datapulse-frontend:${IMAGE_TAG:-latest}
    container_name: dp-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
