# SonarQube / SonarCloud Configuration for DataPulse Phase 1
sonar.projectKey=datapulse-phase1
sonar.projectName=DataPulse Phase 1
sonar.projectVersion=1.0.0

# Source and Test directories
sonar.sources=backend/src,python-eda/eda,frontend/src
sonar.tests=backend/tests,python-eda/tests

# Encodings
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/.pytest_cache/**,**/uploads/**
sonar.coverage.exclusions=**/tests/**,**/node_modules/**

# Language specific configurations
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.python.coverage.reportPaths=python-eda/coverage.xml
